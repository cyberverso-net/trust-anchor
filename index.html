<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRUST ANCHOR , a text adventure</title>
<meta name="description" content="A text adventure in the European digital identity ecosystem. Personal, satirical, not legal advice.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="shell">
  <header>
    <b>TRUST ANCHOR</b>
    <p class="sr-only">A text adventure. Output appears below as you type commands. Type HELP for the list of commands, and SCORE or DASHBOARD to hear your current state.</p>
    <div id="hud" aria-hidden="true">
      <span>PRIVACY <i id="hp">100</i></span>
      <span>TRUST <i id="ht">0</i></span>
      <span>DISCLOSURES <i id="hd">0</i></span>
    </div>
  </header>
  <div id="out" role="log" aria-live="polite" aria-relevant="additions" aria-label="Game output"></div>
  <form autocomplete="off">
    <label for="in" class="sr-only">Type a command. Type HELP for a list of commands.</label>
    <span id="prompt" aria-hidden="true">&gt;</span>
    <input id="in" autofocus spellcheck="false" autocapitalize="off" autocorrect="off"
           placeholder="type a command, or HELP">
  </form>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
