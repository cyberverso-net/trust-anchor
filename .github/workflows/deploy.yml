name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the default for the workflow is read-only, and only the
# deploy job is granted what Pages needs.
permissions:
  contents: read

# Per-ref, so a pull request can never cancel a deployment of main.
concurrency:
  group: trust-anchor-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Acceptance tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the acceptance tests
        run: node test/playthrough.mjs
      - name: Check the game is self-contained
        run: node test/assets.mjs
      - name: Check the data file contract
        run: node test/contract.mjs

  deploy:
    name: Deploy to Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
